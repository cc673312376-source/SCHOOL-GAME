<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101722">
  <title>挚友的1000种死法｜Demo</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="story.css?v=2">
  <link rel="stylesheet" href="level.css?v=1">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p>千禧年代 · 老城区 · 时间轮回</p>
        <h1>挚友的1000种死法</h1>
      </div>
      <div class="header-actions">
        <button id="story" class="ghost story-button">世界背景</button>
        <button id="reset" class="ghost">重置地图</button>
      </div>
    </header>

    <section class="stats" aria-label="城市属性">
      <div><span>💰 经济</span><strong id="economy">+1</strong></div>
      <div><span>🛡 治安</span><strong id="security">-1</strong></div>
      <div><span>🌿 民生</span><strong id="livelihood">+12</strong></div>
      <div><span>👥 人口</span><strong id="population">+10</strong></div>
    </section>

    <section class="loop-strip" aria-label="每轮时间流程">
      <div><strong>周日</strong><span>带着记忆归来</span></div>
      <div><strong>周一—周五</strong><span>观察与改变城市</span></div>
      <div><strong>周六</strong><span>结算最终案件</span></div>
    </section>

    <section class="map-card">
      <div class="map-heading">
        <div><span>老城区 · 8 × 8 城市网格</span><strong id="mode-hint">第一次轮回无法移动建筑</strong></div>
        <label class="switch"><input id="heat-toggle" type="checkbox" checked><span></span>犯罪热力</label>
      </div>
      <div class="axis-x"><i></i><b>1</b><b>2</b><b>3</b><b>4</b><b>5</b><b>6</b><b>7</b><b>8</b></div>
      <div class="map-row">
        <div class="axis-y"><b>1</b><b>2</b><b>3</b><b>4</b><b>5</b><b>6</b><b>7</b><b>8</b></div>
        <div id="map" class="map">
          <div id="cells" class="layer cells"></div>
          <div id="heatmap" class="layer heatmap"></div>
          <div id="influence" class="layer influence"></div>
          <div id="building-layer" class="layer building-layer"></div>
        </div>
      </div>
      <div class="legend"><span><i class="road-dot"></i>固定道路</span><span><i class="school-dot"></i>所选建筑影响区</span><span><i class="warm-dot"></i>预值 4—6</span><span><i class="hot-dot"></i>预值 ≥ 7</span></div>
    </section>

    <section class="control-card">
      <div class="level-heading">
        <div><small>第一关 · 老城区</small><strong id="phase-title">第一次轮回：只能观察</strong></div>
        <span id="phase-badge">周日</span>
      </div>
      <div class="resource-row">
        <div><span>🧠 SAN</span><strong id="san">未觉醒</strong></div>
        <div><span>📌 特殊事件</span><strong id="event-count">待观察</strong></div>
        <div><span>🔥 预值峰值</span><strong><b id="peak">0</b> / 7</strong></div>
      </div>
      <div class="building-picker">
        <button data-building-id="school_01"><span>🏫</span><strong>xx中学</strong><small>3×3 · 可移动</small></button>
        <button data-building-id="shop_01" class="selected"><span>🏪</span><strong>小卖部</strong><small>2×2 · 可移动</small></button>
        <button data-building-id="police_01"><span>👮</span><strong>派出所</strong><small>2×2 · 本关固定</small></button>
        <button data-building-id="diner_01"><span>🍜</span><strong>大排档</strong><small>3×2 · 可移动</small></button>
        <button data-building-id="residential_01"><span>🏠</span><strong>居民楼1</strong><small>2×2 · 本关固定</small></button>
        <button data-building-id="residential_02"><span>🏘️</span><strong>居民楼2</strong><small>3×1 · 本关固定</small></button>
      </div>
      <p id="condition-text" class="condition-text">建筑和道路已经固定。先让城市自然运行一周，观察它为什么走向惨剧。</p>
      <button id="simulate" class="primary"><span id="simulate-label">推进至周六结算</span><small id="simulate-hint">观察五日事件 → 生成犯罪预值 → 触发最终案件</small></button>
    </section>

    <section class="log-card">
      <h2>演算记录</h2>
      <ol id="log"><li>2000年6月11日，星期日。距离好友遇害还有5天。</li></ol>
    </section>
  </main>

  <dialog id="modal" aria-labelledby="modal-title">
    <div class="modal-card">
      <p id="modal-tag"></p>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <button id="modal-close">继续规划</button>
    </div>
  </dialog>
  <script src="rules.js?v=4"></script>
  <script src="game.js?v=4"></script>
</body>
</html>
